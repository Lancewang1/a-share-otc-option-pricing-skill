 const S=DATA.stocks[code],base=new Date(valDate+'T00:00:00');

 if((S.ind||'').match(/半导体|元器件|通信|IT设备|专用机械/))

/* ================== 曲面构造：个股无挂牌期权，由 RV + peers + 指数 skew 合成 ================== */
/* 偏斜引擎开关：'cond' = 数据学习的条件微笑（默认，冠军）  'form' = 公式生成（挑战者/旧版） */
let SKEWSRC='cond';
function buildSurf(code){
 const S=DATA.stocks[code], CF=(DATA.cond||{})[code];
 // ATM 期限结构：短端锚 blend(RV20,RV60,HAR)，长端向 RV250 均值回复（P 测度已实现波动率预测）
 const shortA=0.30*S.rv20+0.35*S.rv60+0.35*S.har20;
 const longA=0.45*S.rv250+0.55*shortA;
 // 【旧】公式偏斜：指数 skew × beta 不对称 —— 实证证明符号是反的，保留为挑战者做对照
 const asym=Math.max(S.betaDn/Math.max(S.beta,.1),0.6);
 const rhoF=Math.max(-0.92,Math.min(-0.10,-0.30*asym-0.06*Math.min(S.kurtR,8)/8));
 const etaF=Math.max(0.35,Math.min(1.4,0.55+0.05*Math.min(S.jump,10)+0.20*(S.limHit/12)));
 const base={rv20:S.rv20,rv60:S.rv60,rv250:S.rv250,har:S.har20,asym,shortA,longA,rhoOld:rhoF,etaOld:etaF};
 if(SKEWSRC==='cond'&&CF)
  return {atm0:CF.atm0,atmInf:CF.atmInf,kap:1.5,rho:CF.rho,eta:CF.eta,gam:CF.gam,
    src:Object.assign({mode:'cond',vrp:CF.vrp,sysF:CF.sysF,res:CF.res,lam:CF.lam,
      cap:CF.cap,N:CF.N,tgt:CF.tgt,kg:CF.kg,nb:CF.n},base)};
 return {atm0:shortA,atmInf:longA,kap:1.5,rho:rhoF,eta:etaF,gam:0.44,
   src:Object.assign({mode:'form',vrp:1,sysF:0,res:null},base)};}
function mkSurf(p){
 const th=T=>Math.pow(p.atm0+(p.atmInf-p.atm0)*(1-Math.exp(-p.kap*T)),2)*T;
 const phi=t=>p.eta/(Math.pow(Math.max(t,1e-9),p.gam)*Math.pow(1+t,1-p.gam));
 const f=(k,T)=>{const TT=Math.max(T,1/365),t=th(TT),ph=phi(t),x=ph*k+p.rho;
  return Math.sqrt(Math.max(.5*t*(1+p.rho*ph*k+Math.sqrt(x*x+1-p.rho*p.rho)),1e-10)/TT);};
 f.p=p;return f;}
/* 覆盖：期限 × delta 支柱，局部权重混入 */
const TEN=[['1W',7/365],['1M',1/12],['3M',.25],['6M',.5],['1Y',1]];
const DEL=[['10dP',-.10],['25dP',-.25],['ATM',.50],['25dC',.25],['10dC',.10]];
function kOfDelta(F,T,s,d){
 if(Math.abs(d-.5)<1e-9)return .5*s*s*T;
 const cp=d>0?1:-1,tg=Math.abs(d);let lo=-3,hi=3;
 for(let i=0;i<70;i++){const k=(lo+hi)/2,v=s*Math.sqrt(T),d1=(-k+.5*v*v)/v;
  const dl=cp>0?N_(d1):N_(-d1);if(dl>tg){if(cp>0)lo=k;else hi=k;}else{if(cp>0)hi=k;else lo=k;}}
 return (lo+hi)/2;}
function markedIV(k,T){
 let s=BASE_SURF(k,T);
 if(OVR.vol.length){let num=0,den=0;
  OVR.vol.forEach(o=>{const Tp=TEN.find(x=>x[0]===o.ten)[1],dv=DEL.find(x=>x[0]===o.del)[1];
   const kp=kOfDelta(1,Tp,BASE_SURF(0,Tp),dv);
   const w=Math.exp(-Math.pow((k-kp)/0.13,2)-Math.pow(Math.log(T/Tp)/0.6,2));
   num+=w*(o.v-BASE_SURF(kp,Tp));den+=w;});
  if(den>1e-6)s+=num/(den+1);}
 return Math.max(s+MKT.volShift,0.02);}
function arbChk(){
 const ks=[];for(let k=-.7;k<=.7001;k+=.025)ks.push(+k.toFixed(3));
 const Ts=TEN.map(t=>t[1]);let bt=0,cal=0;const h=1e-3;
 Ts.forEach(T=>ks.forEach(k=>{const w=(a,b)=>Math.pow(markedIV(a,b),2)*b;
  const w0=w(k,T),wp=w(k+h,T),wm=w(k-h,T),d1=(wp-wm)/(2*h),d2=(wp-2*w0+wm)/(h*h);
  const g=Math.pow(1-k*d1/(2*Math.max(w0,1e-9)),2)-(d1*d1/4)*(1/Math.max(w0,1e-9)+.25)+d2/2;
  if(g<-1e-6)bt++;}));
 for(let i=0;i<Ts.length-1;i++)ks.forEach(k=>{
  if(Math.pow(markedIV(k,Ts[i+1]),2)*Ts[i+1]<Math.pow(markedIV(k,Ts[i]),2)*Ts[i]-1e-9)cal++;});
 return{bt,cal,n:ks.length*Ts.length};}
</script>
<script>

 OVR={vol:[],div:[],bw:[]};}

function pvDiv(T){let s=0;const base=new Date(document.getElementById('vdate').value+'T00:00:00');

/* ================== 自然语言解析 ================== */
function TRDcpGuess(t){return /\b(ep|ap)\b|看跌|认沽|put/.test(t)?-1:1;}
function parseNL(s){
 const raw=s.trim(); if(!raw)return null;
 const o={warn:[]}; const t=raw.toLowerCase();
 // 名义本金
 let rest=t;
 let m=t.match(/([\d.]+)\s*(亿|万|w|mm)\s*(面值|名义|notional)?/);
 if(!m)m=t.match(/([\d.]+)\s*(m)\s*(?:面值|名义|notional)/);
 if(m){const v=parseFloat(m[1]),u=m[2];
  o.notional=u==='亿'?v*1e8:((u==='万'||u==='w')?v*1e4:v*1e6);
  rest=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);}   // 名义消耗掉，避免 2000w 被当成 2000 周
 else{m=t.match(/(?:面值|名义|notional)\D{0,3}([\d,]+)/);
  if(m){o.notional=parseFloat(m[1].replace(/,/g,''));rest=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);}}
 // 期限（在剔除名义之后的串上匹配）
 m=rest.match(/(\d+(?:\.\d+)?)\s*(个月|月|month|mo|m(?![a-z])|周|week|w(?![a-z])|年|year|y(?![a-z])|天|日|day|d(?![a-z]))/);
 if(m){const v=parseFloat(m[1]),u=m[2];
  o.T=/年|year|y/.test(u)?v:(/周|week|w/.test(u)?v*7/365:(/天|日|day|d/.test(u)?v/365:v/12));}
 // 类型
 if(/\b(ep|ap)\b|看跌|认沽|put/.test(rest))o.cp=-1; else if(/\b(ec|ac)\b|看涨|认购|call/.test(rest))o.cp=1;
 o.style=/\b(ac|ap)\b|美式|american/.test(rest)?'AM':'EU';
 // 行权价
 if(/atmf|平值远期/.test(rest)){o.kMode='atmf';}
 else if(/\batm\b|平值/.test(rest)){o.kMode='atm';}
 else if((m=rest.match(/(?:虚值|otm)\s*(\d+(?:\.\d+)?)\s*%?/))){o.kMode='pct';o.kPct=100+parseFloat(m[1])*(TRDcpGuess(rest)>0?1:-1);o.otm=1;}
 else if((m=rest.match(/(?:实值|itm)\s*(\d+(?:\.\d+)?)\s*%?/))){o.kMode='pct';o.kPct=100-parseFloat(m[1])*(TRDcpGuess(rest)>0?1:-1);}
 else if((m=rest.match(/(\d{2,3}(?:\.\d+)?)\s*%\s*(?:行权|strike|k)?/))){o.kMode='pct';o.kPct=parseFloat(m[1]);}
 else if((m=t.match(/(?:k|行权价)\s*[=:＝]?\s*([\d.]+)/))){o.kMode='abs';o.kAbs=parseFloat(m[1]);}
 // 方向
 if(/客户卖出|卖给我|我方买入|we buy|客卖/.test(t))o.side='客户卖出'; else o.side='客户买入';
 // 标的：先代码后名称
 m=raw.match(/(\d{6})(?:\.(SZ|SH|sz|sh))?/);
 if(m){const hit=Object.keys(DATA.stocks).find(c=>c.startsWith(m[1]));if(hit)o.code=hit;}
 if(!o.code){for(const c in DATA.stocks){const nm=DATA.stocks[c].name;
   if(raw.includes(nm)||raw.toUpperCase().includes(nm.toUpperCase())){o.code=c;break;}}}
 if(!o.code){const m2=raw.match(/(?:on|标的|underlying)\s*([一-龥A-Za-z0-9]+)/i);
  if(m2){const q=m2[1];const hit=Object.keys(DATA.stocks).find(c=>DATA.stocks[c].name.includes(q.slice(0,3)));
   if(hit)o.code=hit;else o.warn.push('标的未识别：'+q);}else o.warn.push('未识别标的');}
 if(o.notional==null)o.warn.push('未识别名义本金');
 if(o.T==null)o.warn.push('未识别期限');
 if(o.cp==null){o.cp=1;o.warn.push('未识别方向，默认看涨');}
 return o;}
function applyNL(o){
 if(!o)return;
 if(o.code&&o.code!==CODE){CODE=o.code;initMkt();}
 if(o.notional)TRD.notional=o.notional;
 if(o.T)TRD.T=o.T;
 if(o.cp)TRD.cp=o.cp;
 TRD.style=o.style||'EU'; TRD.side=o.side||'客户买入';
 TRD.kMode=o.kMode||'atm';
 if(o.kMode==='pct')TRD.kPct=o.kPct;
 if(o.kMode==='abs')TRD.kAbs=o.kAbs;
 renderChips(o); go();}
function renderChips(o){
 const h=document.getElementById('chips');
 if(!o){h.innerHTML='';return;}
 const S=DATA.stocks[o.code||CODE];
 const c=[];
 c.push(`<span class="cp">标的 <b>${S?S.name:'?'}</b> ${o.code||CODE}</span>`);
 c.push(`<span class="cp">名义 <b>${money(TRD.notional)}</b></span>`);
 c.push(`<span class="cp">期限 <b>${TRD.T<1?Math.round(TRD.T*12)+'M':TRD.T+'Y'}</b></span>`);
 c.push(`<span class="cp">${TRD.style==='EU'?'欧式':'美式'} <b>${TRD.cp>0?'看涨':'看跌'}</b></span>`);
 c.push(`<span class="cp">行权 <b>${TRD.kMode==='atm'?'ATM 平值':(TRD.kMode==='atmf'?'ATMF':(TRD.kMode==='abs'?TRD.kAbs:TRD.kPct+'%'))}</b></span>`);
 c.push(`<span class="cp">${TRD.side}</span>`);
 (o.warn||[]).forEach(w=>c.push(`<span class="cp bad">${w}</span>`));
 h.innerHTML=c.join('');}

<script>
/* ================== 跨境状态与曲线 ================== */
const FXS={USDCNH:DATA.fx.USDCNH.p[DATA.fx.USDCNH.p.length-1],
           USDHKD:DATA.fx.USDHKD.p[DATA.fx.USDHKD.p.length-1]};
function rvOf(a){let s=0,m=0;const r=[];for(let i=1;i<a.length;i++)r.push(Math.log(a[i]/a[i-1]));
 m=r.reduce((x,y)=>x+y,0)/r.length;r.forEach(x=>s+=(x-m)*(x-m));return Math.sqrt(s/(r.length-1)*252);}
const FXVOL={CNH:rvOf(DATA.fx.USDCNH.p),HKD:rvOf(DATA.fx.USDHKD.p)};
// 股票与 USDCNH 的相关性（真实计算，用于 quanto）
function eqFxCorr(){const p=DATA.fx.USDCNH.p,r=[];for(let i=1;i<p.length;i++)r.push(Math.log(p[i]/p[i-1]));
 const s=DATA.tgtR.slice(-r.length),n=Math.min(s.length,r.length);
 const a=s.slice(-n),b=r.slice(-n);
 const ma=a.reduce((x,y)=>x+y,0)/n,mb=b.reduce((x,y)=>x+y,0)/n;
 let c=0,va=0,vb=0;for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);va+=(a[i]-ma)**2;vb+=(b[i]-mb)**2;}
 return c/Math.sqrt(va*vb);}
let XB={};
function initXB(){
 XB={ccy:'USD',skind:'quanto',
  usdcnh:FXS.USDCNH, usdhkd:FXS.USDHKD,

  usdCurve:{'1M':.0431,'3M':.0434,'6M':.0429,'1Y':.0418},
  hkdCurve:{'1M':.0392,'3M':.0401,'6M':.0408,'1Y':.0412},
  fxVol:FXVOL.CNH, fxVolHkd:FXVOL.HKD,
  rhoEqFx:+eqFxCorr().toFixed(4),    // corr(股票, USDCNH)
  wht:0.10,                          // 境外机构股息红利预扣税
  fgnHold:0.031, fgnCap:0.30,        // 外资合计持股 / 上限（indicative）
  b2bBp:45,                          // 背对背境内券商通道费 bp/年
  fxHedgeBp:12,                      // FX 对冲执行成本 bp
  corrResvBp:0                       // 相关性储备（quanto 时按 vega×dρ 计）
 };}
const tenKey=T=>T<=1/12?'1M':(T<=.25?'3M':(T<=.5?'6M':'1Y'));
const rDom=T=>XB.ccy==='USD'?XB.usdCurve[tenKey(T)]:(XB.ccy==='HKD'?XB.hkdCurve[tenKey(T)]:MKT.r);
const fxRate=()=>XB.ccy==='USD'?1/XB.usdcnh:(XB.ccy==='HKD'?XB.usdhkd/XB.usdcnh:1);  // 1 CNY = ? 报价币
const fxVolOf=()=>XB.ccy==='USD'?XB.fxVol:(XB.ccy==='HKD'?Math.sqrt(XB.fxVol**2+XB.fxVolHkd**2):0);
/* 陆股通交易日历：A股交易日中剔除 indicative 的通道关闭日（结算假期）*/
function connectClosedDays(T){
 const d0=document.getElementById('vdate').value.replace(/-/g,'');
 const idx=DATA.cal.d.findIndex(x=>x>=d0); if(idx<0)return{aDays:0,cDays:0};
 const need=Math.round(T*365); let aDays=0,cnt=0;
 for(let i=idx;i<DATA.cal.d.length&&cnt<need;i++,cnt++) if(DATA.cal.o[i])aDays++;
 // indicative：陆股通因结算安排，全年约有 8 个 A 股交易日不开放（长假前后 + 港假）
 const cDays=Math.round(aDays*(8/244));
 return{aDays,cDays};}

<script>
/* ================== 跨境报价瀑布 v3 ================== */
function quote(){
 const S=S_(),T=Math.max(TRD.T,1/365);
 // 分红：境外机构 A 股股息预扣 10% → 有效分红 = 税后
 const whtOn=XB.ccy!=='CNY'||true;   // 客户为境外主体，始终按税后
 const eff=1-XB.wht;
 const pv=(()=>{let s=0;const base=new Date(document.getElementById('vdate').value+'T00:00:00');
   MKT.divs.forEach(d=>{const t=(new Date(d.d+'T00:00:00')-base)/864e5/365;
    if(t>0&&t<=T)s+=d.amt*eff*Math.exp(-MKT.r*t);});return s;})();
 // 融券费率是远期的【负】carry：持股方可出借收 b，做空方付 b ⇒ 难借的票远期低于纯现金持有成本
 // （A股 IF/IC 长期贴水是同一现象）。方向由远期统一承载，不再按看涨/看跌分别加减。
 const F=MKT.divMode==='discrete'?(MKT.spot-pv)*Math.exp((MKT.r-bwOf(T))*T)
        :MKT.spot*Math.exp((MKT.r-bwOf(T)-MKT.divY*eff)*T);
 const spot=MKT.spot;
 const K=TRD.kMode==='abs'?TRD.kAbs:(TRD.kMode==='atmf'?F:spot*(TRD.kMode==='pct'?TRD.kPct/100:1));
 const k=Math.log(K/F);
 const volBase=markedIV(k,T);
 // 事件
 const evs=evCal(CODE,document.getElementById('vdate').value).filter(e=>e.t>0&&e.t<=T);
 const dayVol=S.rv60/Math.sqrt(252), evMove=Math.max(dayVol*2.6,0.035);
 const evVar=evs.reduce((a,e)=>a+Math.max(Math.pow(evMove*e.sig,2)-dayVol*dayVol,0),0);
 const volEvent=Math.sqrt(Math.max(volBase*volBase+evVar/T,1e-8));
 // Quanto / Composite
 const sfx=fxVolOf(), rho=XB.rhoEqFx;
 // Y = 报价币 per CNY = 1/USDCNH ⇒ ρ(S,Y) = −ρ(S,USDCNH)
 const rhoSY=-rho;
 let volPricing=volEvent, driftAdj=0, skNote='';
 if(XB.skind==='quanto'&&XB.ccy!=='CNY'){
   driftAdj=-rhoSY*volEvent*sfx;                       // 加到 CNY 资产的漂移上
   skNote=`−ρ(S,Y)·σ_S·σ_FX = ${nf(driftAdj*1e4,0)}bp，ρ(S,USDCNH)=${nf(rho,3)} ⇒ ρ(S,Y)=${nf(rhoSY,3)}`;
 }else if(XB.skind==='composite'&&XB.ccy!=='CNY'){
   volPricing=Math.sqrt(volEvent*volEvent+sfx*sfx+2*rhoSY*volEvent*sfx);
   skNote=`σ² + σ_fx² + 2ρσσ_fx ⇒ ${pc(volPricing,2)}（本币 ${pc(volEvent,2)}）`;
 }else skNote='CNY 结算，客户自行承担换汇';
 // peers / 预测
 const pvv=DATA.peers.map(c=>{const p=DATA.stocks[c];
   return (0.30*p.rv20+0.35*p.rv60+0.35*p.har20)*Math.pow(S.beta/Math.max(p.beta,.1),0.5);}).sort((a,b)=>a-b);
 const pLo=pvv[1],pHi=pvv[pvv.length-2];
 const peerFlag=volBase<pLo?'低于同类组':(volBase>pHi?'高于同类组':'在同类组区间内');
 const fRV=S.har20*Math.pow(S.rv250/Math.max(S.har20,.01),Math.min(T/1,1)*0.45);
 // 曲面自身的 P 测度 ATM（剥掉 VRP）—— carry 要跟它比，不能跟另一条外推公式比
 const sp=BASE_SURF.p, thT=Math.pow(sp.atm0+(sp.atmInf-sp.atm0)*(1-Math.exp(-sp.kap*T)),2)*T;
 const atmQ=Math.sqrt(thT/T), atmP=atmQ/((sp.src&&sp.src.vrp)||1);
 // 理论价（CNY 口径，quanto 时用调整后漂移）
 const q0=MKT.r-Math.log(F/spot)/T;
 const rUse=MKT.r+(XB.skind==='quanto'&&XB.ccy!=='CNY'?driftAdj:0);
 const g=grk(spot,K,T,rUse,q0,volPricing,TRD.cp);
 const sh=TRD.notional/spot, pxPct=g.px/spot;
 // 对冲成本
 const dlSh=Math.abs(g.d)*sh;
 const advSh=(S.turn/100)*(S.circMv*1e4/spot);
 const part=advSh>0?dlSh/advSh:0;
 const impact=MKT.impactK*(S.rv60/Math.sqrt(252))*Math.sqrt(Math.max(part,0))*Math.abs(g.d);
 const needShort=TRD.cp<0;
 // 融券的【价格】已在远期里；这里只留【可得性/召回】储备：A股融券是行政配给，
 // 期限内被召回要按当时的价重新借。按费率的 RECALL 比例计提（ASM-029）。
 const RECALL=0.25;
 const borrowCost=needShort?RECALL*bwOf(T)*T*Math.abs(g.d):0;
 const nGap=S.limHit*T, gapCost=0.5*g.g*spot*spot*Math.pow(S.band,2)*nGap/spot;
 // 跨境专有
 const cal=connectClosedDays(T);
 const connOK=S.isHs==='S'||S.isHs==='H';
 const connCost=connOK?0.5*g.g*spot*spot*Math.pow(dayVol*Math.sqrt(2),2)*cal.cDays/spot:0;
 const headroom=Math.max(XB.fgnCap-XB.fgnHold,0);
 const needPct=dlSh/((S.circMv*1e4/spot));       // 对冲股数占自由流通股本
 const fgnRisk=headroom<0.03?0.0025*Math.sqrt(T):(needPct>headroom*0.1?0.0008*Math.sqrt(T):0);
 const basisCost=XB.ccy!=='CNY'?Math.abs(XB.basisBp)/1e4*T:0;
 const b2b=XB.b2bBp/1e4*T;
 const creditC=(MKT.credit/1e4)*T, capC=(MKT.capital/1e4)*T;
 const fxHedge=XB.ccy!=='CNY'?(XB.fxHedgeBp/1e4)*(XB.skind==='quanto'?1:0.4):0;
 // quanto 相关性储备：ρ 波动 ±0.15 对价格的影响
 let corrResv=0;
 if(XB.skind==='quanto'&&XB.ccy!=='CNY'){
   const alt=grk(spot,K,T,MKT.r+(-(-(rho+0.15))*volEvent*sfx),q0,volPricing,TRD.cp).px/spot;
   corrResv=Math.abs(alt-pxPct);}
 const baC=(MKT.baSpread/2)*(g.v*100)/spot;
 const hedge=impact+borrowCost+gapCost+connCost+fgnRisk;
 const xbc=basisCost+b2b+fxHedge+corrResv;
 const total=pxPct+hedge+xbc+creditC+capC+baC;
 const client=TRD.side==='客户买入'?total:Math.max(pxPct-hedge-xbc-creditC-capC-baC,0);
 const fxr=fxRate();
 return{S,T,F,K,k,spot,q:q0,volBase,volEvent,volPricing,driftAdj,skNote,sfx,rho,rhoSY,
  evs,evVar,evMove,dayVol,pLo,pHi,peerFlag,fRV,atmP,atmQ,
  carry:volPricing-atmP,carryFRV:volPricing-fRV,g,sh,pxPct,pv,eff,
  impact,borrowCost,gapCost,connCost,fgnRisk,basisCost,b2b,fxHedge,corrResv,creditC,capC,baC,
  hedge,xbc,total,client,part,advSh,dlSh,nGap,needShort,cal,connOK,headroom,needPct,fxr,
  prem:client*TRD.notional, premFx:client*TRD.notional*fxr, theo:pxPct*TRD.notional,
  notlFx:TRD.notional*fxr};}
function go(){const t0=performance.now();Q=quote();renderAll();
 document.getElementById('stat').textContent=
  `${S_().name} · ${TRD.T<1?Math.round(TRD.T*12)+'M':TRD.T+'Y'} ${TRD.cp>0?'Call':'Put'} · ${XB.ccy} ${XB.skind} · ${pc(Q.client,3)} · ${(performance.now()-t0).toFixed(0)}ms`;}

function tip(e,h){TTip.innerHTML=h;TTip.style.opacity=1;const r=TTip.getBoundingClientRect();

function plot(host,cfg){
 const W=cfg.w||520,H=cfg.h||150,P={t:8,r:cfg.r||10,b:20,l:cfg.l||44};

 const X=v=>P.l+(v-x0)/(x1-x0||1)*iw,Y=v=>P.t+ih-(v-y0)/(y1-y0||1)*ih;

 for(let i=0;i<=nt;i++){const t=y0+(y1-y0)*i/nt;
  g.appendChild(E('line',{x1:P.l,x2:P.l+iw,y1:Y(t),y2:Y(t),stroke:'var(--line)','stroke-width':1}));

  g.appendChild(E('text',{x:X(t),y:H-6,'text-anchor':'middle',fill:'var(--ink3)','font-size':9},cfg.xf?cfg.xf(t):nf(t,cfg.xd??1)));}
 (cfg.marks||[]).forEach(m=>{if(m.v!=null)g.appendChild(E('line',{x1:X(m.v),x2:X(m.v),y1:P.t,y2:P.t+ih,
   stroke:m.c||'var(--ink3)','stroke-width':1,'stroke-dasharray':'3 3'}));
  if(m.h!=null)g.appendChild(E('line',{x1:P.l,x2:P.l+iw,y1:Y(m.h),y2:Y(m.h),stroke:m.c||'var(--line2)','stroke-width':1}));
  if(m.tx!=null)g.appendChild(E('text',{x:X(m.tx),y:Y(m.ty),fill:m.c||'var(--ink3)','font-size':9,'text-anchor':m.an||'start'},m.t));});
 (cfg.bars||[]).forEach(b=>{const bw=Math.max(3,iw/b.d.length*.62);

   const rc=E('rect',{x:cx-bw/2,y:Math.min(y0b,y1b),width:bw,height:Math.max(1.5,Math.abs(y1b-y0b)),rx:2,

 host.innerHTML='';host.appendChild(g);}

<script>
/* ---- ① 波动率预测 ---- */
function cFcst(c){
 const S=S_(),T=Q.T;
 pnl(c,'① 预测属性：不只是总结过去','<span class="chip on">HAR-RV 真实拟合</span>',b=>{
  const h=document.createElement('div');h.className='hint';
  h.innerHTML=`RV 是回看的，报价要看的是<b>期限内将实现的波动</b>。用 HAR-RV（日/周/月已实现方差回归未来 20 日）做预测，
   再按均值回复外推到定价期限。样本内 R² = <b>${nf(S.harR2,3)}</b>（波动率预测的 R² 通常在 0.1–0.3，这是正常量级）。`;
  b.appendChild(h);
  const rows=[['RV 5日',S.rv5,'最近一周，噪声大'],['RV 20日',S.rv20,'一个月'],['RV 60日',S.rv60,'三个月'],
    ['RV 250日',S.rv250,'一年，长期锚'],['HAR 20日预测',S.har20,'<b>模型输出</b>'],
    ['<b>曲面 ATM（P 测度）</b>',Q.atmP,`<b>定价用的水平锚</b> = 0.30RV20+0.35RV60+0.35HAR，κ=1.5 向 RV250 回复到 ${nf(T*12,1)}M`],
    ['曲面 ATM（Q 测度）',Q.atmQ,`P × 个股 VRP ${nf((BASE_SURF.p.src&&BASE_SURF.p.src.vrp)||1,4)}（只加在系统性方差上）`],
    ['旁证：另一条外推 fRV',Q.fRV,`HAR×(RV250/HAR)^(0.45T) —— 与曲面锚<b>不是同一个公式</b>，差 ${sg((Q.fRV-Q.atmP)*100,1)}pt，仅作交叉验证`],
    ['定价波动率',Q.volEvent,'曲面 ATM(Q) + 偏斜 + 事件加点'],
    ['<b>隐含 − 预测（carry）</b>',Q.carry,(Q.carry>0?'<span class="pos">卖方有 carry</span>':'<span class="neg">卖方无 carry，报价偏低</span>')
      +`　口径 = 定价波动率 − 曲面 P 测度 ATM（若对 fRV 则为 ${sg(Q.carryFRV*100,1)}pt）`]];
  tbl(b,['指标','年化','说明'],rows.map(r=>[r[0],
    r[0].includes('carry')?sg(r[1]*100,2)+'%':pc(r[1],1),r[2]]));
  // RV 期限结构图
  const d=[[5,S.rv5*100],[20,S.rv20*100],[60,S.rv60*100],[250,S.rv250*100]];
  const lo=Math.min(...d.map(p=>p[1]),Q.fRV*100,Q.atmP*100)*.9;
  const hiY=Math.max(...d.map(p=>p[1]),Q.volEvent*100)*1.08;
  plot(b.appendChild(document.createElement('div')),{h:150,l:40,x:[0,260],y:[lo,hiY],yd:0,xd:0,
   marks:[{h:Q.volEvent*100,c:'var(--warn)'},{tx:150,ty:hiY*0.985,t:'定价波动率',c:'var(--warn)'}],
   s:[{d,c:'var(--acc)',w:1.8,dots:true,tip:p=>`RV ${p[0]}日<br><b>${nf(p[1],1)}%</b>`}],
   pts:[{x:Math.round(T*252),y:Q.atmP*100,c:'var(--pos)',tip:`曲面 ATM（P 测度）<br><b>${pc(Q.atmP,1)}</b>`},
        {x:Math.round(T*252),y:Q.fRV*100,c:'var(--ink3)',tip:`旁证 fRV<br><b>${pc(Q.fRV,1)}</b>`}]});
  const h2=document.createElement('div');h2.className='hint';
  h2.innerHTML=`<span style="color:var(--acc)">●</span> 已实现（回看）　<span style="color:var(--pos)">●</span> 曲面 ATM（P 测度，定价锚）　
   <span style="color:var(--ink3)">●</span> 旁证 fRV　<span style="color:var(--warn)">—</span> 定价波动率。
   <b>定价波动率与绿点的差就是这笔交易的 vol carry</b>（灰点是另一条外推公式，只用来交叉验证，不进定价）。`;
  b.appendChild(h2);
 },true);
 pnl(c,'近 120 日收益与波动聚集','真实数据',b=>{
  const r=DATA.tgtR,n=r.length;
  const cum=[];let x=0;r.forEach((v,i)=>{x+=v;cum.push([i,x*100]);});
  plot(b,{h:110,l:40,x:[0,n-1],y:[Math.min(...cum.map(p=>p[1]))*1.1,Math.max(...cum.map(p=>p[1]))*1.1],yd:0,xd:0,

   const m=w.reduce((a,v)=>a+v,0)/10;rl.push([i,Math.sqrt(w.reduce((a,v)=>a+(v-m)**2,0)/9*252)*100]);}
  plot(b.appendChild(document.createElement('div')),{h:110,l:40,x:[0,n-1],
   y:[0,Math.max(...rl.map(p=>p[1]))*1.1],yd:0,xd:0,
   marks:[{h:S.rv250*100,c:'var(--ink3)'}],s:[{d:rl,c:'var(--warn)',w:1.5}]});
  const h=document.createElement('div');h.className='hint';
  h.innerHTML=`上：累计对数收益（%）　下：10 日滚动年化波动率，灰线为 250 日均值。
   波动聚集明显 → HAR 的日/周/月分解有效，也意味着<b>短期限报价对当前 regime 极度敏感</b>。`;
  b.appendChild(h);
 },true);
}
/* ---- ② 同类组 ---- */
function cPeers(c){
 const S=S_();
 pnl(c,'② 同类组：按波动率行为聚类，不按行业分类','<span class="chip on">真实计算</span>',b=>{
  const h=document.createElement('div');h.className='hint';
  h.innerHTML=`同类组用 <b>RV60 / β / 下行β / 跳跃频率 / 峰度 / 换手</b> 六维标准化距离聚出来，不是申万分类。
   <b>${S.name} 的申万行业是「${S.ind}」，但它的波动率行为同类组是下面这些</b> —— 这就是为什么用行业分类给个股外推曲面会错。`;
  b.appendChild(h);
  const rows=DATA.peers.map(pc_=>{const p=DATA.stocks[pc_];
   return [`${p.name} <span class="mut">${pc_}</span>`,p.ind,pc(p.rv60,1),pc(p.har20,1),
     nf(p.beta,2),nf(p.betaDn,2),nf(p.jump,0),nf(p.turn||0,1)+'%',nf(DATA.peerDist[pc_],2),
     nf(DATA.corr[pc_]||0,2)];});
  rows.unshift([`<b>${S.name}</b> <span class="mut">${CODE}</span>`,`<b>${S.ind}</b>`,`<b>${pc(S.rv60,1)}</b>`,`<b>${pc(S.har20,1)}</b>`,
    `<b>${nf(S.beta,2)}</b>`,`<b>${nf(S.betaDn,2)}</b>`,`<b>${nf(S.jump,0)}</b>`,`<b>${nf(S.turn||0,1)}%</b>`,'—','1.00']);
  tbl(b,['标的','申万行业','RV60','HAR预测','β','下行β','跳跃/年','换手','距离','与标的相关'],rows,{hi:i=>i===0});
  const pv=DATA.peers.map(x=>{const p=DATA.stocks[x];
    return {c:x,nm:p.name,v:(0.30*p.rv20+0.35*p.rv60+0.35*p.har20)*Math.pow(S.beta/Math.max(p.beta,.1),0.5)};})
    .sort((a,b2)=>a.v-b2.v);
  plot(b.appendChild(document.createElement('div')),{h:150,l:40,x:[-.5,pv.length-.5],
   y:[0,Math.max(...pv.map(p=>p.v*100),Q.volBase*100)*1.12],yd:0,
   marks:[{h:Q.volBase*100,c:'var(--warn)'},{h:Q.pLo*100,c:'var(--ink3)'},{h:Q.pHi*100,c:'var(--ink3)'}],
   bars:[{d:pv.map((p,i)=>[i,p.v*100]),c:'var(--acc)',cats:(p,i)=>pv[i].nm.slice(0,4),
     tip:(p,i)=>`${pv[i].nm}<br>β 调整后隐含公允波动率 <b>${nf(p[1],1)}%</b>`}]});
  const h2=document.createElement('div');h2.className='hint';
  h2.innerHTML=`每只 peer 的公允波动率按 <b>β 平方根缩放</b>映射到本标的。黄线 = 当前 marked 基准 <b>${pc(Q.volBase,2)}</b>，
   灰线 = 同类组 10–90 分位区间 <b>${pc(Q.pLo,1)} – ${pc(Q.pHi,1)}</b>。
   当前判定：<b>${Q.peerFlag}</b>${Q.peerFlag==='在同类组区间内'?'（无需调整）':'（建议复核 marked 曲面）'}。`;
  b.appendChild(h2);
 },true);
}

<script>
/* ---- ③ 未来事件 ---- */
function cEvent(c){
 const S=S_(),T=Q.T,all=evCal(CODE,document.getElementById('vdate').value);
 pnl(c,'③ 未来事件：从「事后解释波动」到「事前定价波动」','<span class="chip w">日历为 indicative</span>',b=>{
  const h=document.createElement('div');h.className='hint';
  h.innerHTML=`把日历拆成<b>事件日</b>与<b>非事件日</b>，事件日给更高方差权重（business-time 时间变换）。
   单次事件典型跳幅 = 日常日波动 × 2.6 = <b>${pc(Q.evMove,1)}</b>，超出常规的部分才计入事件方差。`;
  b.appendChild(h);
  const rows=all.map(e=>{const inT=e.t>0&&e.t<=T;
   const ex=Math.max(Math.pow(Q.evMove*e.sig,2)-Q.dayVol*Q.dayVol,0);
   return [e.d,e.nm,{earn:'财报',unlock:'解禁',index:'指数',macro:'行业'}[e.kind],
     nf(e.t*365,0)+'天',nf(e.sig,2),pc(Q.evMove*e.sig,1),
     inT?`<span class="pos">✓ 超额 ${nf(Math.sqrt(ex)*100,1)}%</span>`:'<span class="mut">期限外</span>',e.note||''];});
  tbl(b,['日期','事件','类型','距今','显著性','预期跳幅','是否计入','备注'],rows,{hi:i=>all[i].t>0&&all[i].t<=T});
  const bars=[['非事件日常规方差',Q.volBase*Q.volBase*T],['事件超额方差',Q.evVar]];
  const tot=bars[0][1]+bars[1][1];
  const w=document.createElement('div');w.className='wf';
  bars.forEach(([nm,v])=>wfRow(w,nm,nf(v*1e4,2)+' (×10⁻⁴)',pc(v/tot,1)+' 占比',
    nm.includes('事件')?'var(--warn)':'var(--acc)',v/tot));
  wfRow(w,'<b>期限总方差 → 定价波动率</b>',`<b>${pc(Math.sqrt(tot/T),2)}</b>`,
    `基准 ${pc(Q.volBase,2)} → +${pc(Q.volEvent-Q.volBase,2)}`,'var(--pos)',1,true);
  b.appendChild(w);
  // 事件加点随期限的变化
  const Ts=[];for(let t=1/24;t<=1.51;t+=1/24)Ts.push(+t.toFixed(4));
  const line=Ts.map(t=>{const ev=all.filter(e=>e.t>0&&e.t<=t);
   const v=ev.reduce((a,e)=>a+Math.max(Math.pow(Q.evMove*e.sig,2)-Q.dayVol*Q.dayVol,0),0);
   return [t,(Math.sqrt(Q.volBase*Q.volBase+v/t)-Q.volBase)*100];});
  plot(b.appendChild(document.createElement('div')),{h:150,l:40,x:[0,1.5],
   y:[0,Math.max(...line.map(p=>p[1]))*1.15],yd:1,xd:2,
   marks:[{v:T,c:'var(--warn)'},{tx:T,ty:Math.max(...line.map(p=>p[1]))*1.05,t:'当前期限',c:'var(--warn)'}],
   s:[{t:'area',d:line,c:'var(--warn)',w:1.8}]});
  const h2=document.createElement('div');h2.className='hint';
  h2.innerHTML=`事件加点（vol pt）随期限的锯齿形态 —— 每跨过一个事件就跳一档，之后被更长的期限稀释。
   <b>这就是为什么 1M 和 3M 的报价不能靠插值：中间夹了几个财报，差别是结构性的。</b>`;
  b.appendChild(h2);
 },true);
}

 const S=S_(),T=Q.T;

  const h=document.createElement('div');h.className='hint';
  h.innerHTML=`期权台真正用得上的资金流不是「谁在买」，而是<b>流动性与波动机制</b>：能不能对冲得掉、对冲要付多少、波动会被放大还是压制。`;
  b.appendChild(h);
  const advD=Q.advSh*MKT.spot;
  const crowd=(S.rzye/1e8)/(S.circMv/1e4);   // 两融余额 / 自由流通市值
  tbl(b,['指标','数值','对报价的影响'],[
   ['自由流通市值',money(S.circMv*1e4),'决定可对冲容量'],
   ['20 日平均换手（自由流通）',pc((S.turn||0)/100,2),'流动性基准'],
   ['日均成交金额',money(advD),'冲击成本分母'],
   ['本笔对冲占日均成交',`<b>${pc(Q.part,2)}</b>`,
     Q.part>0.15?'<span class="neg">需分批建仓，冲击成本已计 '+pc(Q.impact,3)+'</span>':'可单日完成'],
   ['两融余额',money(S.rzye),'融券可得性代理'],
   ['两融 20 日变动',sg((S.rzChg20||0)*100,1)+'%',(S.rzChg20||0)<-0.05?'<span class="neg">杠杆资金撤出 → 波动可能上行</span>':'稳定'],
   ['20 日主力净流入',`<span class="${(S.mfNet20||0)>=0?'pos':'neg'}">${money((S.mfNet20||0)*1e4)}</span>`,'方向性资金'],
   ['5 日 / 20 日流入强度',nf(S.mfTrend||0,2),(S.mfTrend||0)<-1?'<span class="neg">近期加速流出</span>':'—'],

<script>
/* ================== 连板 KO：定价 + 横截面套利筛选 ==================
   市场 convention 是「两三个涨停就 KO，不 price，当卖方 buffer」。
   本模块把它 price 出来：涨停是自激过程（无条件 λ 低、条件续板概率高），
   纯扩散会把连板概率低估几个数量级，所以用【局部波动率扩散 + 涨停自激状态】混合模型。 */
const KOCFG={N:2,lock:0,rebate:0,paths:12000,on:false};
let KOCACHE=null;

/* ---- 由 marked 曲面导出局部方差（Dupire，Gatheral 总方差形式） ---- */
function locVar(k,T){
 const h=0.012,dt=Math.max(T*0.05,2/365);
 const w=(a,b)=>{const v=markedIV(a,Math.max(b,1/365));return v*v*Math.max(b,1/365);};
 const Tm=Math.max(T-dt,1/365),Tp=T+dt;
 const wT=(w(k,Tp)-w(k,Tm))/(Tp-Tm);
 const w0=Math.max(w(k,T),1e-9),wk=(w(k+h,T)-w(k-h,T))/(2*h),wkk=(w(k+h,T)-2*w0+w(k-h,T))/(h*h);
 const den=1-k*wk/w0+0.25*(-0.25-1/w0+k*k/(w0*w0))*wk*wk+0.5*wkk;
 return Math.max(wT/Math.max(den,0.05),1e-6);}
/* 预先把 σ_LV 打成 (k,t) 网格，MC 里双线性插值 */
function lvGrid(T,nT){
 const NK=41,kLo=-1.2,kHi=1.2,g=new Float64Array(NK*nT);
 for(let j=0;j<nT;j++){const t=T*(j+0.5)/nT;
  for(let i=0;i<NK;i++){const k=kLo+(kHi-kLo)*i/(NK-1);g[j*NK+i]=Math.sqrt(locVar(k,t));}}
 return {g,NK,kLo,kHi,nT,T,at(k,j){
   const x=(Math.min(Math.max(k,this.kLo),this.kHi)-this.kLo)/(this.kHi-this.kLo)*(this.NK-1);
   const i=Math.min(Math.floor(x),this.NK-2),f=x-i;
   return this.g[j*this.NK+i]*(1-f)+this.g[j*this.NK+i+1]*f;}};}

/* ---- 截断正态的 E[e^X]（解析），用于逐状态求漂移使一步鞅性成立 ---- */
function eTrunc(mu,sd,a,bb){
 const z=(v)=>N_((v-mu)/sd),zs=(v)=>N_((v-mu-sd*sd)/sd);
 const p=z(bb)-z(a); if(p<1e-12)return Math.exp(mu+.5*sd*sd);
 return Math.exp(mu+.5*sd*sd)*(zs(bb)-zs(a))/p;}
function driftFor(sd,pl,L,tgt){           /* 解 m 使 pl(1+band)+(1-pl)E[e^X]=tgt */
 let lo=-0.4,hi=0.4;
 for(let i=0;i<60;i++){const m=(lo+hi)/2;
  const e=pl*Math.exp(L)+(1-pl)*eTrunc(m,sd,-L,L);
  if(e>tgt)hi=m;else lo=m;}
 return (lo+hi)/2;}

/* Q 打标 + 强制重算 */
(function(){const _q=quote;quote=function(){const r=_q.apply(null,arguments);if(r)r.code=CODE;return r;};})();
function quoteNow(){Q=quote();}
/* ---- 主 MC ---- */
/* 固定种子 + 共同随机数：不同 volScale 之间可比，校准解才稳定 */
function koPaths(o,vs){
 const S=S_(),K0=DATA.ko.stocks[CODE];
 const T=Math.max(TRD.T,1/365),cp=TRD.cp,spot=MKT.spot,K=Q.K;
 const nd=Math.max(Math.round(T*252),1), dt=T/nd;
 const band=K0.band, L=Math.log(1+band);
 const lam=Math.min(K0.limYr/252,0.25);
 const kap=DATA.ko.kappa||1;
 const p2=Math.min(Math.max(K0.p2*kap,0.005),0.85), p3=Math.min(DATA.ko.p3*kap,0.85);
 const boost=DATA.ko.rvBoost;
 const F=Q.F, q0=MKT.r-Math.log(F/spot)/T, gro=Math.exp((MKT.r-q0)*dt);
 const lnFS=Math.log(F/spot);
 const LV=o.LV||lvGrid(T,nd);
 const NP=o.paths|0, N=o.N, lockD=Math.round(o.lock*252), reb=o.rebate;
 /* 逐状态漂移：只依赖 (sd,pl)，缓存 */
 const dc=new Map();
 const drift=(sd,pl)=>{const key=(Math.round(sd*1e4))+'|'+(Math.round(pl*1e4));
  let v=dc.get(key); if(v===undefined){v=driftFor(sd,pl,L,gro);dc.set(key,v);} return v;};
 let sumV=0,sumK=0,nTrig=0,sumST=0; const tHist=new Array(nd).fill(0);
 let seed=2463534242>>>0;
 const rnd=()=>{seed^=seed<<13;seed>>>=0;seed^=seed>>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296;};
 for(let p=0;p<NP;p++){
  let x=0,run=0,ko=-1;
  for(let j2=0;j2<nd;j2++){
   const kt=x-lnFS*(j2+0.5)/nd;                        /* 相对远期的 log-moneyness */
   const sd=Math.min(LV.at(kt,j2)*Math.sqrt(dt)*vs*boost[Math.min(run,3)],0.45);
   const pl=run===0?lam:(run===1?p2:p3);
   const m=drift(sd,pl);
   let up=false;
   if(rnd()<pl){x+=L;up=true;}
   else{let r=0,ok=false;
    for(let a=0;a<40;a++){const u=rnd()||1e-9,v2=rnd();
     r=m+sd*Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307179586*v2);
     if(r<L&&r>-L){ok=true;break;}}
    if(!ok)r=Math.max(-L*0.999,Math.min(L*0.999,r));
    x+=r;}
   run=up?run+1:0;
   if(ko<0&&j2>=lockD&&run>=N)ko=j2;

  const van=Math.max(cp*(ST-K),0);

   fwdErr:sumST/NP/F-1,LV};}

function koMC(o){

 /* 防呆：Q 必须与当前标的/交易一致，否则先重算（切标的时 Q 会是上一只的） */
 if(!Q||Q.code!==CODE||Math.abs(Q.T-Math.max(TRD.T,1/365))>1e-9){quoteNow();}
 const T=Math.max(TRD.T,1/365),spot=MKT.spot;
 const q0=MKT.r-Math.log(Q.F/spot)/T;
 const bs=grk(spot,Q.K,T,MKT.r,q0,markedIV(Q.k,T),TRD.cp).px/spot;
 const cal={paths:Math.min(o.paths,8000),N:o.N,lock:o.lock,rebate:o.rebate};
 const r0=koPaths(cal,1.0); cal.LV=r0.LV;               /* LV 网格只建一次，后续复用 */
 let s0=1.0,s1=1.25,f0=r0.van-bs;
 let r1=koPaths(cal,s1),f1=r1.van-bs,s=s1,it=0;
 while(Math.abs(f1)>3e-4&&it<6){
  const ds=(s1-s0)||1e-6, dn=(f1-f0)/ds;
  s=Math.abs(dn)>1e-9?s1-f1/dn:s1; s=Math.max(0.5,Math.min(3.5,s));
  s0=s1;f0=f1;s1=s;r1=koPaths(cal,s1);f1=r1.van-bs;it++;}
 const dnF=(s1-s0)?((f1-f0)/(s1-s0)):0;
 const fin={paths:o.paths,N:o.N,lock:o.lock,rebate:o.rebate,LV:cal.LV};
 let R=koPaths(fin,s1),sF=s1;
 /* 校准跑在 8k 路径上，最终跑在完整路径上，两者噪声不同 —— 用校准得到的斜率再做一步全路径修正 */
 if(o.paths>cal.paths&&Math.abs(dnF)>1e-9){
  const s2=Math.max(0.5,Math.min(3.5,sF-(R.van-bs)/dnF));
  if(Math.abs(s2-sF)>1e-4){const R2=koPaths(fin,s2);
   if(Math.abs(R2.van-bs)<Math.abs(R.van-bs)){R=R2;sF=s2;it++;}}}
 R.vs=sF; R.bsVan=bs; R.calIt=it; R.dbg={s0,s1,f0,f1,dnF,sF};
 R.koVal=R.van-R.wko; R.loss=R.van>1e-9?1-R.wko/R.van:0;
 return R;}

<script>
/* ================== 引擎 B：factor + machine learning ==================
   网络在【合成 A 股面板】上预训练（162 万样本，5 个独立模拟面板池化），
   再在 15,706 个真实样本上轻微调。浏览器内做前向推理 —— 这不是查表，是模型在跑。
   输出仍然只是【形状】，水平锚在 marked 曲面，最后过同一套无套利 eSSVI 投影。 */
function mlReady(){return !!(DATA.ml&&DATA.ml.W);}
function mlFwd(x){
 const N=DATA.ml; let a=new Float64Array(x.length);
 for(let i=0;i<x.length;i++)a[i]=(x[i]-N.mean[i])/N.scale[i];
 for(let L=0;L<N.W.length;L++){
  const W=N.W[L],b=N.B[L],m=b.length,o=new Float64Array(m);
  for(let j=0;j<m;j++){let s=b[j];for(let i=0;i<a.length;i++)s+=a[i]*W[i][j];
   o[j]=(L<N.W.length-1)?(s>0?s:0):s;}
  a=o;}
 return a[0];}
/* 逐股静态特征；rvMul 让交易员现场改 RV20 看模型响应（证明是活模型不是查表） */
function mlFeat(code,z,rvMul){
 const st=DATA.ml.stat[code].slice(),ix=DATA.ml.idx;
 if(rvMul&&rvMul!==1){st[0]*=rvMul;st[1]*=rvMul;st[2]*=rvMul;}
 return st.concat(ix,[z,z*z,Math.max(z,0),Math.min(z,0),st[4]*z,st[5]*z]);}
function mlSmile(code,zs,rvMul){
 const st=DATA.ml.stat[code],rv=st[1]*(rvMul||1);
 return zs.map(z=>Math.exp(mlFwd(mlFeat(code,z,rvMul)))*rv);}

/* 三引擎的曲面参数 */
function surfParams(code,mode){
 const keep=SKEWSRC; SKEWSRC=mode; const p=buildSurf(code); SKEWSRC=keep; return p;}
function engine3(){
 const T=Math.max(TRD.T,1/365),spot=MKT.spot,K=Q.K,k=Q.k;
 const q0=MKT.r-Math.log(Q.F/spot)/T; const o={};
 ['cond','form','ml'].forEach(md=>{
  const p=surfParams(CODE,md); if(!p)return;
  const f=mkSurf(p), v=Math.max(f(k,T)+MKT.volShift,0.02);
  o[md]={rho:p.rho,eta:p.eta,gam:p.gam,res:p.src.res,iv:v,
